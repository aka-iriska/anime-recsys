[project]
name = "core"
version = "0.1.0"
description = "Shared kernel: paths, checks, catalog rules and anime features (used by training and serving)"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.5.3",
    "pandas>=3.0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/core"]
