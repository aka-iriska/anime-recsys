[project]
name = "serving"
version = "0.1.0"
description = "Production inference: builds a feed from exported model artifacts"
requires-python = ">=3.12"
dependencies = [
    "core",
    "numpy>=2.5.3",
    "pandas>=3.0.6",
    "catboost>=1.2.10",
    "fastapi>=0.162.0",
    "uvicorn>=0.30",
]

[tool.uv.sources]
core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/serving"]
