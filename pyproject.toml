[project]
name = "shikimori-rec-sys"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "catboost>=1.2.10",
    "numpy>=2.5.3",
    "pandas>=3.0.6",
]

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "matplotlib>=3.11.2",
]
train = [
    "huggingface-hub>=2.4.0",
    "implicit>=0.7.3",
    "scipy>=1.18.1",
]

[tool.uv]
default-groups = ["dev", "train"]  # локально ставим всё; для выдачи: uv sync --no-default-groups

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/shikimori_rec"]
