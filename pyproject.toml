[project]
name = "shikimori-rec-sys"
version = "0.1.0"
description = "Anime recommender for Shikimori users: research workspace"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "core",
    "serving",
    "training",
]

[dependency-groups]
dev = [
    "graphviz>=0.21",
    "httpx>=0.28.1",
    "ipykernel>=7.3.0",
    "matplotlib>=3.11.2",
    "pytest>=9.2.0",
]

[tool.uv.workspace]
members = ["packages/*"]  # core, serving, training; прод ставит только serving: uv sync --package serving

[tool.uv.sources]
core = { workspace = true }
serving = { workspace = true }
training = { workspace = true }
