services:
  backend:
    build:
      context: ./backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend/models:/app/models:ro  # артефакты модели: переобучили – перезапустили контейнер, пересборка не нужна
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 5

  frontend:
    build:
      context: ./frontend
    ports:
      - "3000:80"
    environment:
      - API_URL=http://localhost:8000  # адрес бэкенда, как его видит браузер
    depends_on:
      backend:
        condition: service_healthy
