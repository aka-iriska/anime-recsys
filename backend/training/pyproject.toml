[project]
name = "training"
version = "0.1.0"
description = "Offline data preparation, evaluation, model training and export"
requires-python = ">=3.12"
dependencies = [
    "core",
    "serving",
    "numpy>=2.5.3",
    "pandas>=3.0.6",
    "catboost>=1.2.10",
    "implicit>=0.7.3",
    "scipy>=1.18.1",
    "huggingface-hub>=2.4.0",
    "optuna>=5.0.0",
]

[tool.uv.sources]
core = { workspace = true }
serving = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/training"]
